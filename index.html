<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0a11">
<title>Mini8 Lab</title>
<style>
:root{--bg:#0d0a11;--panel:#17121f;--panel2:#0a0810;--border:#342641;--text:#f6f1fa;--muted:#b5a9bd;--violet:#8d55dd;--violet2:#a86cff;--green:#70e6a2;--red:#ff7b8b;--yellow:#ffd36b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#0d0a11,#120d18 50%,#0d0a11);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,monospace;min-height:100vh}header{position:sticky;top:0;z-index:20;background:#0d0a11ee;backdrop-filter:blur(14px);padding:13px;border-bottom:1px solid var(--border)}h1{font:700 20px system-ui;margin:0}main{max-width:900px;margin:auto;padding:10px 10px 92px}.card{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:11px;margin-bottom:10px}h2{font:700 14px system-ui;margin:0 0 9px}.small{font-size:10px;color:var(--muted);line-height:1.4}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0}button{border:1px solid var(--border);background:#241a30;color:#fff;border-radius:10px;padding:10px 6px;font-weight:700}button.primary{background:linear-gradient(#8550d4,#6835b5)}button.ghost{background:#0d0a12}button.danger{color:#ff9aa6}.status{background:var(--panel2);border:1px solid #2b2035;border-radius:9px;padding:8px;min-height:36px;color:var(--muted)}.ok{color:var(--green)}.err{color:var(--red)}.builder{display:grid;gap:8px}.builder-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.field{display:grid;gap:4px}.field label{font-size:10px;color:var(--muted)}select,input,textarea{width:100%;background:#09070d;color:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#bda7cd 50%),linear-gradient(135deg,#bda7cd 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}.condition-pills{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.condition-pills button{padding:8px 3px;font-size:11px}.condition-pills button.active{background:#382155;border-color:#a86cff}.program-list{display:grid;gap:6px;margin-top:10px}.program-row{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;background:#0a0810;border:1px solid #2d2237;border-radius:11px;padding:8px}.program-row.label-row{border-style:dashed;background:#120d18}.addr{color:#c69aff;font-weight:800;text-align:center}.inst-main{min-width:0}.inst-text{font-weight:700;overflow-wrap:anywhere}.inst-meta{font-size:9px;color:var(--muted);margin-top:3px}.row-actions{display:flex;gap:4px}.row-actions button{padding:5px 7px;font-size:11px}.empty{text-align:center;color:var(--muted);padding:16px;border:1px dashed #3b2d48;border-radius:10px}.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1}.tabs button.active{background:#382155;border-color:#a86cff}textarea{min-height:220px;resize:vertical}.regs,.nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.reg,.node{background:#09070d;border:1px solid var(--border);border-radius:9px;text-align:center;padding:7px}.reg .name{font-size:10px;color:var(--muted)}.reg .hex{font-size:18px;font-weight:800}.reg .dec{font-size:11px;color:#d8cde0;margin-top:2px}.node.activeS{border-color:var(--violet2);background:#29173f}.node.activeD{border-color:var(--green);background:#153323}.bus{text-align:center;border:1px dashed #684c7e;border-radius:999px;padding:8px;margin:7px 0}.flags{margin-top:8px}.flag{display:inline-block;padding:5px 8px;border:1px solid var(--border);border-radius:999px}.flag.on{color:var(--green);border-color:#397a54}.listing,.trace{background:#08070b;border:1px solid var(--border);border-radius:9px;max-height:230px;overflow:auto}.line{display:grid;grid-template-columns:40px 80px 1fr;gap:4px;padding:5px;border-bottom:1px solid #1b1422;font-size:11px}.line.current{background:#2a1740}.trace{padding:7px;white-space:pre-wrap;font-size:10px;line-height:1.4}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0d0a11ee;backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:7px 10px calc(7px + env(safe-area-inset-bottom))}.bottom .buttons{max-width:700px;margin:auto}.divider{height:1px;background:#2c2136;margin:9px 0}.label-add{display:grid;grid-template-columns:1fr auto;gap:7px}.hidden{display:none!important}@media(min-width:760px){.builder-grid{grid-template-columns:1fr 1fr 1fr 1fr}.row-actions button{padding:6px 9px}}
</style>
</head>
<body>
<header><h1>Mini8 Lab</h1><div class="small">CPU 8 bits · SSS DDD CC · constructeur visuel</div></header>
<main>
  <div class="card">
    <h2>Construire le programme</h2>
    <div class="tabs"><button id="visualTab" class="active">Mode ludique</button><button id="textTab">Mode texte</button></div>

    <div id="visualPane">
      <div class="builder">
        <div class="builder-grid">
          <div class="field"><label>Source</label><select id="sourceSelect"></select></div>
          <div class="field"><label>Destination</label><select id="destSelect"></select></div>
          <div class="field" id="extraField"><label id="extraLabel">Valeur</label><input id="extraInput" inputmode="text" value="7"></div>
          <div class="field"><label>Condition</label><div class="condition-pills" id="condPills"></div></div>
        </div>
        <button class="primary" id="addInstruction">+ Ajouter l'instruction</button>
        <div class="divider"></div>
        <div class="label-add"><input id="labelInput" placeholder="Nom du label, ex: BOUCLE"><button id="addLabel">+ Label</button></div>
      </div>
      <div id="programList" class="program-list"></div>
    </div>

    <div id="textPane" class="hidden">
      <textarea id="editor"></textarea>
      <div class="small" style="margin-top:6px">Le mode texte reste disponible pour écrire librement des labels et instructions.</div>
    </div>

    <div class="buttons"><button class="primary" data-a="assemble">Assembler</button><button data-a="reset">Reset</button><button data-a="step">Pas</button><button data-a="run">Exécuter</button></div>
    <div id="status" class="status">Prêt.</div>
  </div>

  <div class="card"><h2>CPU</h2><div id="regs" class="regs"></div><div class="flags"><span id="fz" class="flag">Z=0</span> <span id="fc" class="flag">C=0</span></div></div>
  <div class="card"><h2>Datapath du dernier cycle</h2><div class="small">Sources</div><div id="srcs" class="nodes"></div><div id="bus" class="bus">BUS --</div><div class="small">Destinations</div><div id="dsts" class="nodes"></div></div>
  <div class="card"><h2>Code machine</h2><div id="listing" class="listing"></div></div>
  <div class="card"><h2>Trace</h2><div id="trace" class="trace"></div></div>
</main>
<div class="bottom"><div class="buttons"><button class="primary" data-a="assemble">Assembler</button><button data-a="reset">Reset</button><button data-a="step">Pas</button><button data-a="run">Exécuter</button></div></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const S={R0:0,R1:1,R2:2,R3:3,RAM:4,ALU:5,POP:6,CONST:7},D={R0:0,R1:1,R2:2,R3:3,MAR:4,RAM:5,PC:6,PUSH:7},Q={ALWAYS:0,Z:1,NZ:2,C:3},A={ADD:0,SUB:1,AND:2,OR:3,XOR:4,SHL:5,SHR:6,NOT:7};
const SN=Object.keys(S),DN=Object.keys(D),QN=["ALWAYS","Z","NZ","C"],AN=Object.keys(A);
let M=null,timer=null,running=false,mode="visual",condition="ALWAYS";
let rows=[
  {type:"instruction",src:"CONST",dst:"R0",cond:"ALWAYS",extra:"7"},
  {type:"instruction",src:"CONST",dst:"R1",cond:"ALWAYS",extra:"8"},
  {type:"instruction",src:"ALU",dst:"R3",cond:"ALWAYS",extra:"ADD"}
];
const hx=n=>(n&255).toString(16).toUpperCase().padStart(2,"0");
function status(t,c=""){$("status").textContent=t;$("status").className="status "+c}
function escapeHTML(s){return String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function rowToText(r){if(r.type==="label")return r.name+":";let left=r.src;if(r.src==="CONST"||r.src==="ALU")left+=" "+r.extra;return left+" -> "+r.dst+(r.cond!=="ALWAYS"?" IF "+r.cond:"")}
function visualText(){return rows.map(rowToText).join("\n")}
function syncEditorFromRows(){$("editor").value=visualText()}
function clean(s){return s.split(";")[0].split("#")[0].trim()}
function number(t,L,n){t=t.trim();let u=t.toUpperCase(),v;if(u in L)return L[u];if(/^0x/i.test(t))v=parseInt(t,16);else if(/^0b/i.test(t))v=parseInt(t.slice(2),2);else if(/^\d+$/.test(t))v=+t;else throw Error(`Ligne ${n}: valeur/label inconnu ${t}`);if(v<0||v>255)throw Error(`Ligne ${n}: valeur hors plage`);return v}
function assemble(txt){let labels={},parsed=[],pc=0,lines=txt.split(/\r?\n/);lines.forEach((raw,i)=>{let s=clean(raw);if(!s)return;while(s.includes(":")){let k=s.indexOf(":"),l=s.slice(0,k).trim();if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(l))break;l=l.toUpperCase();if(l in labels)throw Error(`Ligne ${i+1}: label dupliqué`);labels[l]=pc;s=s.slice(k+1).trim();if(!s)return}if(!s.includes("->"))throw Error(`Ligne ${i+1}: -> manquant`);let left=s.replace(/\s+IF\s+(Z|NZ|C)\s*$/i,"").split("->")[0].trim(),size=/^(CONST|ALU)\s+/i.test(left)?2:1;parsed.push({n:i+1,a:pc,s});pc+=size;if(pc>256)throw Error("Programme > 256 octets")});let img=new Uint8Array(256),list=[];parsed.forEach(x=>{let s=x.s,cond="ALWAYS",m=s.match(/\s+IF\s+(Z|NZ|C)\s*$/i);if(m){cond=m[1].toUpperCase();s=s.slice(0,m.index).trim()}let p=s.split("->"),l=p[0].trim(),d=p[1].trim().toUpperCase();if(!(d in D))throw Error(`Ligne ${x.n}: destination inconnue ${d}`);let src,extra=null;if(/^CONST\s+/i.test(l)){src="CONST";extra=number(l.replace(/^CONST\s+/i,""),labels,x.n)}else if(/^ALU\s+/i.test(l)){src="ALU";let op=l.replace(/^ALU\s+/i,"").trim().toUpperCase();if(!(op in A))throw Error(`Ligne ${x.n}: ALU inconnue ${op}`);extra=A[op]}else{src=l.toUpperCase();if(!(src in S))throw Error(`Ligne ${x.n}: source inconnue ${src}`)}let op=(S[src]<<5)|(D[d]<<2)|Q[cond],bs=[op];img[x.a]=op;if(extra!==null){img[x.a+1]=extra;bs.push(extra)}list.push({a:x.a,bs,s:x.s})});return{img,list,used:pc,labels}}
class CPU{constructor(img){this.p=new Uint8Array(img);this.ram=new Uint8Array(256);this.reset()}reset(){this.r=[0,0,0,0];this.mar=0;this.pc=0;this.sp=255;this.z=0;this.c=0;this.cy=0;this.last=null;this.ram.fill(0)}cond(q){return q===0||(q===1&&this.z===1)||(q===2&&this.z===0)||(q===3&&this.c===1)}alu(o){let a=this.r[0],b=this.r[1],r=0,c=0;if(o===0){let x=a+b;r=x&255;c=x>255?1:0}else if(o===1){r=(a-b)&255;c=a>=b?1:0}else if(o===2)r=a&b;else if(o===3)r=a|b;else if(o===4)r=a^b;else if(o===5){c=a>>7;r=a<<1&255}else if(o===6){c=a&1;r=a>>1}else if(o===7)r=~a&255;else throw Error("Code ALU inconnu");return{r,z:r===0?1:0,c}}step(){let p0=this.pc,ins=this.p[this.pc],s=ins>>5&7,d=ins>>2&7,q=ins&3,has=s===5||s===7,ext=has?this.p[(this.pc+1)&255]:null,len=has?2:1,ex=this.cond(q),np=(this.pc+len)&255,b=null,f=null,nsp=null;if((s===4||s===6)&&(d===5||d===7))throw Error("Conflit RAM mono-port");if(ex){if(s<=3)b=this.r[s];else if(s===4)b=this.ram[this.mar];else if(s===5){f=this.alu(ext);b=f.r}else if(s===6){nsp=(this.sp+1)&255;b=this.ram[nsp]}else b=ext;if(d<=3)this.r[d]=b;else if(d===4)this.mar=b;else if(d===5)this.ram[this.mar]=b;else if(d===6)np=b;else{this.ram[this.sp]=b;this.sp=(this.sp-1)&255}if(s===6)this.sp=nsp;if(s===5){this.z=f.z;this.c=f.c}}this.pc=np;this.cy++;return this.last={p0,s,d,q,ex,b,p1:this.pc}}}
function renderBuilder(){let pc=0;if(!rows.length){$("programList").innerHTML='<div class="empty">Aucune instruction. Ajoute-en une au-dessus.</div>';return}$("programList").innerHTML=rows.map((r,i)=>{if(r.type==="label")return `<div class="program-row label-row"><div class="addr">${hx(pc)}</div><div class="inst-main"><div class="inst-text">🏷 ${escapeHTML(r.name)}:</div><div class="inst-meta">Label · ne consomme aucun octet</div></div><div class="row-actions"><button data-row="up" data-i="${i}">↑</button><button data-row="down" data-i="${i}">↓</button><button class="danger" data-row="del" data-i="${i}">×</button></div></div>`;let size=(r.src==="CONST"||r.src==="ALU")?2:1,txt=rowToText(r),addr=pc;pc+=size;return `<div class="program-row"><div class="addr">${hx(addr)}</div><div class="inst-main"><div class="inst-text">${escapeHTML(txt)}</div><div class="inst-meta">${size} octet${size>1?"s":""}</div></div><div class="row-actions"><button data-row="up" data-i="${i}">↑</button><button data-row="down" data-i="${i}">↓</button><button class="danger" data-row="del" data-i="${i}">×</button></div></div>`}).join("");syncEditorFromRows()}
function initBuilder(){$("sourceSelect").innerHTML=SN.map(x=>`<option>${x}</option>`).join("");$("destSelect").innerHTML=DN.map(x=>`<option>${x}</option>`).join("");$("sourceSelect").value="CONST";$("destSelect").value="R0";$("condPills").innerHTML=QN.map(x=>`<button data-cond="${x}" class="${x==="ALWAYS"?"active":""}">${x}</button>`).join("");updateExtraField();renderBuilder()}
function updateExtraField(){let s=$("sourceSelect").value;if(s==="CONST"){$("extraField").classList.remove("hidden");$("extraLabel").textContent="Constante / label";let old=$("extraInput").value;if(AN.includes(old))$("extraInput").value="7"}else if(s==="ALU"){$("extraField").classList.remove("hidden");$("extraLabel").textContent="Opération ALU";let sel=document.createElement("select");sel.id="aluTemp";sel.innerHTML=AN.map(x=>`<option>${x}</option>`).join("");let holder=$("extraInput").parentElement;$("extraInput").classList.add("hidden");if(!$("aluTemp"))holder.appendChild(sel)}else{$("extraField").classList.add("hidden")}if(s!=="ALU"){$("extraInput").classList.remove("hidden");$("aluTemp")?.remove()}}
function addInstruction(){let src=$("sourceSelect").value,dst=$("destSelect").value,extra="";if(src==="CONST")extra=$("extraInput").value.trim()||"0";if(src==="ALU")extra=$("aluTemp")?.value||"ADD";rows.push({type:"instruction",src,dst,cond:condition,extra});renderBuilder();status("Instruction ajoutée.","ok")}
function addLabel(){let n=$("labelInput").value.trim();if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(n)){status("Nom de label invalide.","err");return}rows.push({type:"label",name:n.toUpperCase()});$("labelInput").value="";renderBuilder();status("Label ajouté.","ok")}
function renderNodes(){$("srcs").innerHTML=SN.map((n,i)=>`<div class="node src" data-i="${i}">${n}</div>`).join("");$("dsts").innerHTML=DN.map((n,i)=>`<div class="node dst" data-i="${i}">${n}</div>`).join("")}
function renderCPU(){if(!M)return;let c=M.c;$("regs").innerHTML=[...c.r.map((v,i)=>[`R${i}`,v]),["MAR",c.mar],["PC",c.pc],["SP",c.sp]].map(x=>`<div class="reg"><div class="name">${x[0]}</div><div class="hex">0x${hx(x[1])}</div><div class="dec">${x[1]} en décimal</div></div>`).join("");$("fz").textContent="Z="+c.z;$("fc").textContent="C="+c.c;$("fz").classList.toggle("on",!!c.z);$("fc").classList.toggle("on",!!c.c);document.querySelectorAll(".node").forEach(x=>x.classList.remove("activeS","activeD"));$("bus").textContent="BUS --";if(c.last){let l=c.last;document.querySelector(`.src[data-i="${l.s}"]`)?.classList.add("activeS");document.querySelector(`.dst[data-i="${l.d}"]`)?.classList.add("activeD");$("bus").textContent=l.ex&&l.b!==null?`BUS 0x${hx(l.b)} · ${l.b} décimal`:"BUS --"}document.querySelectorAll(".line").forEach(x=>x.classList.toggle("current",+x.dataset.a===c.pc))}
function currentSourceText(){return mode==="visual"?visualText():$("editor").value}
function asmUI(){pause();try{let p=assemble(currentSourceText());M={p,c:new CPU(p.img)};$("listing").innerHTML=p.list.map(x=>`<div class="line" data-a="${x.a}"><div>${hx(x.a)}</div><div>${x.bs.map(b=>hx(b)+"/"+b).join(" ")}</div><div>${escapeHTML(x.s)}</div></div>`).join("");$("trace").textContent="";renderCPU();status(`Assemblé: ${p.used} octets. Appuie sur Pas ou Exécuter.`,"ok")}catch(e){M=null;status(e.message,"err")}}
function one(){if(!M)asmUI();if(!M)return;try{let l=M.c.step();$("trace").textContent+=`#${M.c.cy} PC=${hx(l.p0)} ${SN[l.s]}->${DN[l.d]} ${QN[l.q]} ${l.ex?"EXEC":"SKIP"} bus=${l.b===null?"--":hx(l.b)+" ("+l.b+")"}\n`;renderCPU();status(`${SN[l.s]} -> ${DN[l.d]} | PC ${hx(l.p0)} -> ${hx(l.p1)}`,"ok");return l}catch(e){pause();status(e.message,"err")}}
function stepUI(){pause();one()}function tick(){let before=M?.c.pc,l=one();if(l&&l.p1===before&&l.d===6&&l.ex){pause();status(`Boucle sur soi-même détectée à ${hx(before)}`,"ok")}}function runUI(){if(!M)asmUI();if(!M)return;if(running){pause();return}running=true;buttons();timer=setInterval(tick,220)}function pause(){if(timer)clearInterval(timer);timer=null;running=false;buttons()}function buttons(){document.querySelectorAll('[data-a="run"]').forEach(b=>b.textContent=running?"Pause":"Exécuter")}function resetUI(){pause();if(!M){asmUI();return}M.c.reset();$("trace").textContent="";renderCPU();status("CPU réinitialisé.","ok")}
function setMode(m){mode=m;$("visualPane").classList.toggle("hidden",m!=="visual");$("textPane").classList.toggle("hidden",m!=="text");$("visualTab").classList.toggle("active",m==="visual");$("textTab").classList.toggle("active",m==="text");if(m==="text")syncEditorFromRows()}
document.addEventListener("click",e=>{let a=e.target?.dataset?.a;if(a==="assemble")asmUI();else if(a==="reset")resetUI();else if(a==="step")stepUI();else if(a==="run")runUI();let c=e.target?.dataset?.cond;if(c){condition=c;document.querySelectorAll("[data-cond]").forEach(b=>b.classList.toggle("active",b.dataset.cond===c))}let rowAct=e.target?.dataset?.row;if(rowAct){let i=+e.target.dataset.i;if(rowAct==="del")rows.splice(i,1);if(rowAct==="up"&&i>0)[rows[i-1],rows[i]]=[rows[i],rows[i-1]];if(rowAct==="down"&&i<rows.length-1)[rows[i+1],rows[i]]=[rows[i],rows[i+1]];renderBuilder()}});
$("sourceSelect").addEventListener("change",updateExtraField);$("addInstruction").onclick=addInstruction;$("addLabel").onclick=addLabel;$("visualTab").onclick=()=>setMode("visual");$("textTab").onclick=()=>setMode("text");
renderNodes();initBuilder();asmUI();
</script>
</body>
</html>
