<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mini8 Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0a11;color:#f6f1fa;font:14px ui-monospace,SFMono-Regular,Menlo,monospace}header{position:sticky;top:0;background:#0d0a11ee;padding:13px;border-bottom:1px solid #342641;z-index:5}h1{font:700 20px system-ui;margin:0}main{max-width:850px;margin:auto;padding:10px 10px 80px}.card{background:#17121f;border:1px solid #342641;border-radius:14px;padding:10px;margin-bottom:10px}h2{font:700 14px system-ui;margin:0 0 8px}textarea{width:100%;min-height:240px;background:#08070b;color:#eee;border:1px solid #342641;border-radius:10px;padding:10px;font:13px/1.5 ui-monospace;resize:vertical}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0}button{border:1px solid #342641;background:#241a30;color:white;border-radius:10px;padding:10px 4px;font-weight:700}.primary{background:#713dc0}.status{background:#09070d;border:1px solid #2b2035;border-radius:9px;padding:8px;min-height:36px;color:#b5a9bd}.ok{color:#70e6a2}.err{color:#ff7b8b}.regs,.nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.reg,.node{background:#09070d;border:1px solid #342641;border-radius:9px;text-align:center;padding:7px}.reg b{font-size:18px}.node.activeS{border-color:#a86cff;background:#29173f}.node.activeD{border-color:#70e6a2;background:#153323}.bus{text-align:center;border:1px dashed #684c7e;border-radius:999px;padding:8px;margin:7px 0}.flags{margin-top:8px}.flag{display:inline-block;padding:5px 8px;border:1px solid #342641;border-radius:999px}.flag.on{color:#70e6a2;border-color:#397a54}.listing,.trace{background:#08070b;border:1px solid #342641;border-radius:9px;max-height:230px;overflow:auto}.line{display:grid;grid-template-columns:40px 66px 1fr;gap:4px;padding:5px;border-bottom:1px solid #1b1422;font-size:11px}.line.current{background:#2a1740}.trace{padding:7px;white-space:pre-wrap;font-size:10px;line-height:1.4}.small{font-size:10px;color:#b5a9bd}.bottom{position:fixed;left:0;right:0;bottom:0;background:#0d0a11ee;border-top:1px solid #342641;padding:7px 10px calc(7px + env(safe-area-inset-bottom))}.bottom .buttons{max-width:700px;margin:auto}
</style></head><body>
<header><h1>Mini8 Lab</h1><div class="small">CPU 8 bits - SSS DDD CC</div></header>
<main>
<div class="card"><h2>Programme</h2><textarea id="editor"></textarea><div class="buttons"><button class="primary" data-a="assemble">Assembler</button><button data-a="reset">Reset</button><button data-a="step">Pas</button><button data-a="run">Exécuter</button></div><div id="status" class="status">Prêt.</div><div class="small">Ex: CONST 7 -> R0 · ALU ADD -> R3 · CONST LOOP -> PC IF NZ</div></div>
<div class="card"><h2>CPU</h2><div id="regs" class="regs"></div><div class="flags"><span id="fz" class="flag">Z=0</span> <span id="fc" class="flag">C=0</span></div></div>
<div class="card"><h2>Datapath du dernier cycle</h2><div class="small">Sources</div><div id="srcs" class="nodes"></div><div id="bus" class="bus">BUS --</div><div class="small">Destinations</div><div id="dsts" class="nodes"></div></div>
<div class="card"><h2>Code machine</h2><div id="listing" class="listing"></div></div>
<div class="card"><h2>Trace</h2><div id="trace" class="trace"></div></div>
</main>
<div class="bottom"><div class="buttons"><button class="primary" data-a="assemble">Assembler</button><button data-a="reset">Reset</button><button data-a="step">Pas</button><button data-a="run">Exécuter</button></div></div>
<script>
"use strict";
const $=id=>document.getElementById(id),S={R0:0,R1:1,R2:2,R3:3,RAM:4,ALU:5,POP:6,CONST:7},D={R0:0,R1:1,R2:2,R3:3,MAR:4,RAM:5,PC:6,PUSH:7},Q={ALWAYS:0,Z:1,NZ:2,C:3},A={ADD:0,SUB:1,AND:2,OR:3,XOR:4,SHL:5,SHR:6,NOT:7},SN=Object.keys(S),DN=Object.keys(D),QN=["ALWAYS","Z","NZ","C"];
$("editor").value=`CONST 7 -> R0
CONST 8 -> R1
ALU ADD -> R3`;
let M=null,timer=null,running=false;
const hx=n=>(n&255).toString(16).toUpperCase().padStart(2,"0");
function status(t,c=""){$("status").textContent=t;$("status").className="status "+c}
function clean(s){return s.split(";")[0].split("#")[0].trim()}
function number(t,L,n){t=t.trim();let u=t.toUpperCase(),v;if(u in L)return L[u];if(/^0x/i.test(t))v=parseInt(t,16);else if(/^0b/i.test(t))v=parseInt(t.slice(2),2);else if(/^\d+$/.test(t))v=+t;else throw Error(`Ligne ${n}: valeur/label inconnu ${t}`);if(v<0||v>255)throw Error(`Ligne ${n}: valeur hors plage`);return v}
function assemble(txt){let labels={},rows=[],pc=0,lines=txt.split(/\r?\n/);lines.forEach((raw,i)=>{let s=clean(raw);if(!s)return;while(s.includes(":")){let k=s.indexOf(":"),l=s.slice(0,k).trim();if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(l))break;l=l.toUpperCase();if(l in labels)throw Error(`Ligne ${i+1}: label dupliqué`);labels[l]=pc;s=s.slice(k+1).trim();if(!s)return}if(!s.includes("->"))throw Error(`Ligne ${i+1}: -> manquant`);let left=s.replace(/\s+IF\s+(Z|NZ|C)\s*$/i,"").split("->")[0].trim(),size=/^(CONST|ALU)\s+/i.test(left)?2:1;rows.push({n:i+1,a:pc,s});pc+=size;if(pc>256)throw Error("Programme > 256 octets")});let img=new Uint8Array(256),list=[];rows.forEach(x=>{let s=x.s,cond="ALWAYS",m=s.match(/\s+IF\s+(Z|NZ|C)\s*$/i);if(m){cond=m[1].toUpperCase();s=s.slice(0,m.index).trim()}let p=s.split("->"),l=p[0].trim(),d=p[1].trim().toUpperCase();if(!(d in D))throw Error(`Ligne ${x.n}: destination inconnue ${d}`);let src,extra=null;if(/^CONST\s+/i.test(l)){src="CONST";extra=number(l.replace(/^CONST\s+/i,""),labels,x.n)}else if(/^ALU\s+/i.test(l)){src="ALU";let op=l.replace(/^ALU\s+/i,"").trim().toUpperCase();if(!(op in A))throw Error(`Ligne ${x.n}: ALU inconnue ${op}`);extra=A[op]}else{src=l.toUpperCase();if(!(src in S))throw Error(`Ligne ${x.n}: source inconnue ${src}`)}let op=(S[src]<<5)|(D[d]<<2)|Q[cond],bs=[op];img[x.a]=op;if(extra!==null){img[x.a+1]=extra;bs.push(extra)}list.push({a:x.a,bs,s:x.s})});return{img,list,used:pc}}
class CPU{constructor(img){this.p=new Uint8Array(img);this.ram=new Uint8Array(256);this.reset()}reset(){this.r=[0,0,0,0];this.mar=0;this.pc=0;this.sp=255;this.z=0;this.c=0;this.cy=0;this.last=null;this.ram.fill(0)}cond(q){return q===0||(q===1&&this.z===1)||(q===2&&this.z===0)||(q===3&&this.c===1)}alu(o){let a=this.r[0],b=this.r[1],r=0,c=0;if(o===0){let x=a+b;r=x&255;c=x>255?1:0}else if(o===1){r=(a-b)&255;c=a>=b?1:0}else if(o===2)r=a&b;else if(o===3)r=a|b;else if(o===4)r=a^b;else if(o===5){c=a>>7;r=a<<1&255}else if(o===6){c=a&1;r=a>>1}else if(o===7)r=~a&255;else throw Error("Code ALU inconnu");return{r,z:r===0?1:0,c}}step(){let p0=this.pc,ins=this.p[this.pc],s=ins>>5&7,d=ins>>2&7,q=ins&3,has=s===5||s===7,ext=has?this.p[(this.pc+1)&255]:null,len=has?2:1,ex=this.cond(q),np=(this.pc+len)&255,b=null,f=null,nsp=null;if((s===4||s===6)&&(d===5||d===7))throw Error("Conflit RAM mono-port");if(ex){if(s<=3)b=this.r[s];else if(s===4)b=this.ram[this.mar];else if(s===5){f=this.alu(ext);b=f.r}else if(s===6){nsp=(this.sp+1)&255;b=this.ram[nsp]}else b=ext;if(d<=3)this.r[d]=b;else if(d===4)this.mar=b;else if(d===5)this.ram[this.mar]=b;else if(d===6)np=b;else{this.ram[this.sp]=b;this.sp=(this.sp-1)&255}if(s===6)this.sp=nsp;if(s===5){this.z=f.z;this.c=f.c}}this.pc=np;this.cy++;return this.last={p0,s,d,q,ex,b,p1:this.pc}}}
function buildNodes(){$("srcs").innerHTML=SN.map((n,i)=>`<div class="node src" data-i="${i}">${n}</div>`).join("");$("dsts").innerHTML=DN.map((n,i)=>`<div class="node dst" data-i="${i}">${n}</div>`).join("")}
function render(){if(!M)return;let c=M.c;$("regs").innerHTML=[...c.r.map((v,i)=>[`R${i}`,v]),["MAR",c.mar],["PC",c.pc],["SP",c.sp]].map(x=>`<div class="reg"><div>${x[0]}</div><b>${hx(x[1])}</b></div>`).join("");$("fz").textContent="Z="+c.z;$("fc").textContent="C="+c.c;$("fz").classList.toggle("on",!!c.z);$("fc").classList.toggle("on",!!c.c);document.querySelectorAll(".node").forEach(x=>x.classList.remove("activeS","activeD"));$("bus").textContent="BUS --";if(c.last){let l=c.last;document.querySelector(`.src[data-i="${l.s}"]`)?.classList.add("activeS");document.querySelector(`.dst[data-i="${l.d}"]`)?.classList.add("activeD");$("bus").textContent=l.ex&&l.b!==null?`BUS ${hx(l.b)} (${l.b})`:"BUS --"}document.querySelectorAll(".line").forEach(x=>x.classList.toggle("current",+x.dataset.a===c.pc))}
function asmUI(){pause();try{let p=assemble($("editor").value);M={p,c:new CPU(p.img)};$("listing").innerHTML=p.list.map(x=>`<div class="line" data-a="${x.a}"><div>${hx(x.a)}</div><div>${x.bs.map(hx).join(" ")}</div><div>${x.s.replace(/</g,"&lt;")}</div></div>`).join("");$("trace").textContent="";render();status(`Assemblé: ${p.used} octets. Appuie sur Pas ou Exécuter.`,"ok")}catch(e){M=null;status(e.message,"err")}}
function one(){if(!M)asmUI();if(!M)return;try{let l=M.c.step();$("trace").textContent+=`#${M.c.cy} PC=${hx(l.p0)} ${SN[l.s]}->${DN[l.d]} ${QN[l.q]} ${l.ex?"EXEC":"SKIP"} bus=${l.b===null?"--":hx(l.b)}\n`;render();status(`${SN[l.s]} -> ${DN[l.d]} | PC ${hx(l.p0)} -> ${hx(l.p1)}`,"ok");return l}catch(e){pause();status(e.message,"err")}}
function stepUI(){pause();one()}function tick(){let before=M?.c.pc,l=one();if(l&&l.p1===before&&l.d===6&&l.ex){pause();status(`Boucle sur soi-même détectée à ${hx(before)}`,"ok")}}function runUI(){if(!M)asmUI();if(!M)return;if(running){pause();return}running=true;buttons();timer=setInterval(tick,220)}function pause(){if(timer)clearInterval(timer);timer=null;running=false;buttons()}function buttons(){document.querySelectorAll('[data-a="run"]').forEach(b=>b.textContent=running?"Pause":"Exécuter")}function resetUI(){pause();if(!M){asmUI();return}M.c.reset();$("trace").textContent="";render();status("CPU réinitialisé.","ok")}
document.addEventListener("click",e=>{let a=e.target?.dataset?.a;if(a==="assemble")asmUI();else if(a==="reset")resetUI();else if(a==="step")stepUI();else if(a==="run")runUI()});buildNodes();asmUI();
</script></body></html>
